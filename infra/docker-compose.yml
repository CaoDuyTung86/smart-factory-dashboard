# Smart Factory — hạ tầng IIoT giai đoạn 1
#
#   OpenPLC (PLC mềm, chạy ladder thật)
#        │  Modbus TCP :502
#   Gateway (Python)  ──MQTT──►  Mosquitto  ──►  Node-RED / Grafana / …
#        │  WebSocket :8000/ws
#   Dashboard React
#        │  HTTP :8001/inspect
#   Vision AOI (Python + OpenCV)
#
#   Gateway ──asyncpg──►  TimescaleDB  ◄──asyncpg──  MES backend (FastAPI)
#                         :5432                      :8002  REST + WS
#                                                       ▲
#                                              Dashboard React (tab SCADA/MES)
#
# Chạy:   docker compose -f infra/docker-compose.yml up -d --build
# Dừng:   docker compose -f infra/docker-compose.yml down
#
# Lần đầu sẽ lâu (~5-10 phút) vì OpenPLC được build từ mã nguồn — dự án này
# chưa phát hành image dựng sẵn trên Docker Hub.

name: smart-factory

services:
  # --------------------------------------------------------------------
  # PLC mềm: chạy chương trình IEC 61131-3 thật, mở Modbus TCP slave
  # Web UI: http://127.0.0.1:8081  (đăng nhập mặc định openplc / openplc)
  # --------------------------------------------------------------------
  openplc:
    build:
      context: ./openplc
    container_name: smart-factory-openplc
    ports:
      # 8080 là cổng bị tranh chấp nhất trên máy dev (Jenkins, Tomcat, các
      # dev server khác), nên phía host dùng 8081.
      - '8081:8080' # giao diện quản trị
      - '502:502' # Modbus TCP slave
    volumes:
      - openplc-data:/docker_persistent
      # Binary do OpenPLC biên dịch ra nằm ở webserver/core, KHÔNG nằm trong
      # /docker_persistent. Không gắn volume ở đây thì mỗi lần container được
      # tạo lại, runtime âm thầm quay về chương trình rỗng: Modbus vẫn lên,
      # đọc ghi vẫn được, nhưng logic không chạy — rất khó đoán ra.
      - openplc-core:/workdir/webserver/core
      # Chương trình ladder của dự án, để nạp vào runtime.
      - ./plc:/plc:ro
    healthcheck:
      test: ['CMD-SHELL', 'timeout 2 bash -c "</dev/tcp/127.0.0.1/8080" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------------
  # MQTT broker — xương sống của Unified Namespace
  #   1883: MQTT thường (gateway, Node-RED, Python)
  #   9001: MQTT over WebSocket (trình duyệt subscribe trực tiếp)
  # --------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-factory-mosquitto
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      # Dùng pub chứ không dùng sub: sub sẽ nằm chờ một tin nhắn không bao giờ
      # tới rồi hết giờ, khiến broker khoẻ mạnh vẫn bị báo unhealthy.
      test:
        [
          'CMD-SHELL',
          'mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ok || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Edge gateway: Modbus  ->  MQTT + WebSocket + REST
  # --------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
    container_name: smart-factory-gateway
    ports:
      - '8000:8000'
    environment:
      PLC_HOST: openplc
      PLC_PORT: '502'
      PLC_UNIT_ID: '1'
      POLL_INTERVAL_MS: '200'
      MQTT_HOST: mosquitto
      MQTT_PORT: '1883'
      # Unified Namespace: enterprise/site/area/line
      UNS_BASE: foxconn/hanoi/smt/line-1
      LOG_LEVEL: INFO
      # Historian. Bo bien nay di thi gateway van chay y het nhu truoc, chi la
      # khong ghi gi xuong DB — cung mot kieu xuong thang nhu PLC va vision.
      DATABASE_URL: postgresql://factory:factory@timescaledb:5432/factory
      HISTORIAN_ASSET_CODE: CONVEYOR-01
    depends_on:
      mosquitto:
        condition: service_started
      openplc:
        condition: service_started
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Vision AOI: OpenCV kiem tra bo mach — POST /inspect
  # Doc lap voi PLC: khong co PLC no van chay, va nguoc lai.
  # --------------------------------------------------------------------
  vision:
    build:
      context: ./vision
    container_name: smart-factory-vision
    ports:
      - '8001:8001'
    environment:
      LOG_LEVEL: INFO
      # Doi recipe la doi chuong trinh kiem tra, khong phai sua ma nguon.
      RECIPE_DIR: /app/recipes
    volumes:
      - ./vision/recipes:/app/recipes:ro
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Historian: TimescaleDB (Postgres + extension time-series)
  # Schema nam o infra/db/init/, chay tu dong lan dau khi volume con rong.
  # --------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: smart-factory-timescaledb
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
      # Bat continuous aggregate + retention worker. Mac dinh cua image chi co
      # 8 background worker; ba chinh sach cua schema nay can dat cho rieng.
      TIMESCALEDB_TELEMETRY: 'off'
    command:
      - postgres
      - -c
      - timescaledb.max_background_workers=8
      - -c
      - max_worker_processes=16
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d factory']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Backend MES + historian API
  #   REST  :8002/api/...   work order, BOM, routing, genealogy, telemetry
  #   WS    :8002/ws        trang thai day chuyen + OEE, thay cho simulator
  # --------------------------------------------------------------------
  mes:
    build:
      context: ./mes
    container_name: smart-factory-mes
    ports:
      - '8002:8002'
    environment:
      DATABASE_URL: postgresql://factory:factory@timescaledb:5432/factory
      MQTT_HOST: mosquitto
      MQTT_PORT: '1883'
      UNS_BASE: foxconn/hanoi/smt/line-1
      LINE_TICK_MS: '1500'
      LOG_LEVEL: INFO
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped

volumes:
  timescale-data:
  openplc-data:
  openplc-core:
  mosquitto-data:
  mosquitto-log:
