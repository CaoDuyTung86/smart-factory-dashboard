# Mosquitto — MQTT broker cho lop Unified Namespace (UNS)
#
# CANH BAO: cau hinh nay mo (allow_anonymous) va chi dung cho may local /
# mang lab. Truoc khi dua ra ngoai phai bat password_file + TLS (cong 8883).

listener 1883 0.0.0.0
protocol mqtt

# Cong WebSocket: trinh duyet co the subscribe truc tiep vao UNS bang mqtt.js
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
